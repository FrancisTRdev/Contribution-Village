# Keeps the village in this README up to date. It runs the action from this repo, so a failed run means the action is broken.
name: Village

on:
  schedule:
    - cron: '17 0 * * *' # daily, off the busy top of the hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  village:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
      - name: Commit the village
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add village.svg
          git diff --cached --quiet && exit 0
          git commit -m 'Update village'
          git push
